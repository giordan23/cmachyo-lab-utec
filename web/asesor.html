<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asesor de ventas · Lab 06</title>
<style>
  :root { --c: #0a7d8c; --bg: #f4f6f8; --line: #d7dde3; --txt: #1d2329; --mut: #5d6873; --ok: #1b7f4b; --warn: #a86400; --bad: #b3261e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--txt); display: flex; flex-direction: column; }
  header { background: #12343b; color: #fff; padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header b { color: #7fe3f0; } header .sp { flex: 1; } header small { color: #b9d3d8; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .chat { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 80%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .asesor { align-self: flex-end; background: var(--c); color: #fff; border-bottom-right-radius: 4px; }
  .asistente { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .sistema { align-self: center; background: #fff7e6; border: 1px solid #f0d9a8; font-size: 14px; max-width: 92%; }
  .sistema.APROBADA { background: #e3f5ea; border-color: #a9dcbc; } .sistema.RECHAZADA { background: #fbe7e5; border-color: #efb5ae; }
  .meta { font-size: 12px; color: var(--mut); margin-top: 6px; white-space: normal; }
  .asesor .meta { color: #d6f3f6; }
  details { margin-top: 6px; font-size: 13px; white-space: normal; } summary { cursor: pointer; color: var(--c); }
  .cita { border-left: 3px solid var(--c); padding: 4px 10px; margin: 6px 0; background: #f7fafb; }
  .alerta { color: var(--bad); font-weight: 600; }
  .vacio { color: var(--mut); text-align: center; margin-top: 40px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
  footer { border-top: 1px solid var(--line); background: #fff; padding: 10px 16px; }
  .barra { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; }
  .barra textarea { flex: 1; resize: none; height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
  button { background: var(--c); color: #fff; border: 0; border-radius: 10px; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer; min-height: 40px; }
  button.sec { background: #e7eef2; color: var(--txt); font-weight: 500; }
  button:disabled { opacity: .5; cursor: wait; }
  form.cliente { background: #fff; border: 2px solid var(--c); border-radius: 14px; padding: 14px; align-self: stretch; }
  form.cliente h3 { margin: 0 0 8px; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
  label { font-size: 12px; color: var(--mut); } input, select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .acciones { display: flex; gap: 8px; margin-top: 10px; }
  .escribiendo { color: var(--mut); font-style: italic; }
</style>
</head>
<body>
<header>Lab 06 · <b>Asesor de ventas</b> <small>pregunta sobre las reglas; si un cliente necesita evaluación, la envío al analista de riesgos. Datos ficticios.</small>
  <span class="sp"></span>
  <button class="sec" id="escalar">Escalar al analista de riesgos</button>
  <button class="sec" id="nueva">Nueva conversación</button>
</header>
<main id="scroll"><div class="chat" id="chat"></div></main>
<footer><div class="barra">
  <textarea id="txt" placeholder="Escribe tu pregunta… (Enter envía, Shift+Enter salto de línea)" maxlength="1000"></textarea>
  <button id="enviar">Enviar</button>
</div></footer>

<template id="tpl-form">
  <form class="cliente">
    <h3>Datos del cliente para el analista de riesgos</h3>
    <div class="grid">
      <div><label>DNI (ficticio)</label><input name="dni" required pattern="\d{8}" value="40123456"></div>
      <div><label>Nombre</label><input name="nombre" required value="Rosa Quispe"></div>
      <div><label>Edad</label><input name="edad" type="number" min="18" max="100" required value="35"></div>
      <div><label>Calificación SBS</label><select name="calificacion_sbs"><option>Normal</option><option>CPP</option><option>Deficiente</option><option>Dudoso</option><option>Pérdida</option></select></div>
      <div><label>Ingreso mensual (S/)</label><input name="ingreso_mensual" type="number" min="1" step="0.01" required value="3500"></div>
      <div><label>Deuda mensual (S/)</label><input name="deuda_mensual" type="number" min="0" step="0.01" required value="400"></div>
      <div><label>Trabajador</label><select name="tipo_trabajador"><option value="dependiente">Dependiente</option><option value="independiente">Independiente</option></select></div>
      <div><label>Antigüedad (meses)</label><input name="antiguedad_meses" type="number" min="0" required value="24"></div>
      <div><label>Producto</label><select name="producto"><option value="consumo">Crédito Consumo</option><option value="mype">Crédito MYPE</option><option value="vehicular">Crédito Vehicular</option></select></div>
      <div><label>Monto (S/)</label><input name="monto" type="number" min="1" step="0.01" required value="12000"></div>
      <div><label>Plazo (meses)</label><input name="plazo_meses" type="number" min="1" max="360" required value="24"></div>
    </div>
    <div class="acciones"><button>Enviar al analista</button><button type="button" class="sec cancelar">Cancelar</button></div>
  </form>
</template>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const mem = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
              set(k, v) { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };
const EJEMPLOS = ["¿Cuál es el plazo máximo del crédito MYPE?", "¿Y para el vehicular?", "¿Qué documentos pide un independiente?",
                  "Mi cliente gana 3 500 soles y quiere 12 mil a dos años, ¿califica?", "¿A qué hora cierra la agencia?"];
let conv = mem.get("lab06-conv") ? Number(mem.get("lab06-conv")) : null, ultimo = 0, sondeo = null, ultimaPregunta = "";

function citas(lista) {
  if (!lista || !lista.length) return "";
  return `<details><summary>${lista.length} artículo(s) del manual</summary>${lista.map(c =>
    `<div class="cita"><b>Art. ${esc(c.id)} · ${esc(c.titulo)}</b> (pág. ${c.pagina})<br>${esc(c.texto)}</div>`).join("")}</details>`;
}

function pintar(m, enVivo = false) {
  if (m.id <= ultimo) return;
  ultimo = m.id;
  $("chat").querySelector(".vacio")?.remove();
  const d = document.createElement("div"), meta = m.meta || {};
  d.className = `m ${m.rol} ${meta.decision || ""}`;
  let h = esc(m.texto);
  if (m.rol === "asistente") {
    const r = meta.router || {};
    if (meta.consulta && meta.consulta !== ultimaPregunta) h += `<div class="meta">Busqué en el manual: “${esc(meta.consulta)}”</div>`;
    h += citas(meta.citas);
    if (meta.inyeccion_sospechosa) h += `<div class="meta alerta">⚠ Este mensaje parece un intento de dar instrucciones al sistema. Quedó registrado.</div>`;
    h += `<div class="meta">ruta ${esc(meta.ruta)} · ${esc(r.proveedor)} ${r.confianza != null ? "· confianza " + Number(r.confianza).toFixed(2) : ""}${r.respaldo ? " · respaldo" : ""}</div>`;
  }
  if (m.rol === "sistema" && meta.decision) {
    h += `<div class="meta">Cuota estimada S/ ${Number(meta.cuota).toFixed(2)}</div><p style="margin:6px 0 0">${esc(meta.justificacion)}</p>`;
    if (meta.condiciones && meta.condiciones.length) h += `<div class="meta"><b>Condiciones:</b> ${meta.condiciones.map(esc).join(" · ")}</div>`;
    h += citas(meta.citas);
  }
  if (m.rol === "asesor") ultimaPregunta = m.texto;
  d.innerHTML = h;
  $("chat").appendChild(d);
  if (meta.accion === "formulario" && enVivo) formulario("router");   // al recargar no se reabre un formulario viejo
  $("scroll").scrollTop = $("scroll").scrollHeight;
}

function vacio() {
  $("chat").innerHTML = `<div class="vacio">Pregunta sobre productos y reglas de crédito. Ejemplos:<div class="chips">${EJEMPLOS.map(e =>
    `<button class="sec" type="button">${esc(e)}</button>`).join("")}</div></div>`;
  $("chat").querySelectorAll(".chips button").forEach(b => b.onclick = () => { $("txt").value = b.textContent; $("txt").focus(); });
}

async function cargar() {                         // retoma la conversación si recargas la página
  if (!conv) return vacio();
  const r = await fetch(`/api/chat/${conv}?desde=${ultimo}`);
  if (r.status === 404) { conv = null; mem.set("lab06-conv", null); return vacio(); }
  const d = await r.json();
  d.mensajes.forEach(pintar);
  if (!d.mensajes.length && !ultimo) vacio();
  vigilar();
}

function vigilar() {                              // sondeo cada 3 s solo mientras hay una solicitud pendiente
  const pendientes = [...document.querySelectorAll(".m.sistema")].filter(e => e.textContent.includes("enviada al analista")).length;
  const decididas = [...document.querySelectorAll(".m.sistema.APROBADA, .m.sistema.RECHAZADA")].length;
  if (pendientes > decididas && !sondeo) sondeo = setInterval(cargar, 3000);
  if (pendientes <= decididas && sondeo) { clearInterval(sondeo); sondeo = null; }
}

async function enviar() {
  const texto = $("txt").value.trim();
  if (!texto) return;
  $("enviar").disabled = true; $("txt").value = "";
  const escribiendo = document.createElement("div"); escribiendo.className = "m asistente escribiendo"; escribiendo.textContent = "Consultando el manual…";
  $("chat").appendChild(escribiendo); $("scroll").scrollTop = $("scroll").scrollHeight;
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({conversacion_id: conv, mensaje: texto})});
    const d = await r.json();
    escribiendo.remove();
    if (!r.ok) { $("txt").value = texto; alert(`Error ${r.status}: ${JSON.stringify(d.detail)}`); return; }
    conv = d.conversacion_id; mem.set("lab06-conv", String(conv));
    d.mensajes.forEach(m => pintar(m, true));
  } catch (e) { escribiendo.textContent = "No se pudo conectar con la API."; $("txt").value = texto; }
  finally { $("enviar").disabled = false; $("txt").focus(); }
}

function formulario(origen) {
  if (document.querySelector("form.cliente")) return;
  const f = $("tpl-form").content.firstElementChild.cloneNode(true);
  f.querySelector(".cancelar").onclick = () => f.remove();
  f.onsubmit = async ev => {
    ev.preventDefault();
    if (!conv) {                                  // escalar sin haber conversado: conversación vacía, sin llamar a Jev
      const d0 = await (await fetch("/api/chat/nueva", {method: "POST"})).json();
      conv = d0.conversacion_id; mem.set("lab06-conv", String(conv));
    }
    const datos = Object.fromEntries(new FormData(f));
    ["edad", "antiguedad_meses", "plazo_meses"].forEach(k => datos[k] = parseInt(datos[k], 10));
    ["ingreso_mensual", "deuda_mensual", "monto"].forEach(k => datos[k] = parseFloat(datos[k]));
    datos.pregunta = (ultimaPregunta || "Evaluación de riesgo solicitada desde el chat").slice(0, 500).padEnd(3, ".");
    f.querySelector("button").disabled = true;
    const r = await fetch(`/api/chat/${conv}/evaluacion?origen=${origen}`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(datos)});
    const d = await r.json();
    if (!r.ok) { alert(`Error ${r.status}: ${JSON.stringify(d.detail)}`); f.querySelector("button").disabled = false; return; }
    f.remove(); d.mensajes.forEach(pintar); vigilar();
  };
  $("chat").appendChild(f); $("scroll").scrollTop = $("scroll").scrollHeight;
}

$("enviar").onclick = enviar;
$("txt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); } });
$("escalar").onclick = () => formulario("boton");
$("nueva").onclick = () => { conv = null; ultimo = 0; ultimaPregunta = ""; mem.set("lab06-conv", null); clearInterval(sondeo); sondeo = null; vacio(); };
cargar();
</script>
</body>
</html>
