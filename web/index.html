<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente de Ahorros</title>
<style>
/* ── Tokens ───────────────────────────────────────────────────────── */
:root {
  --rojo:         #b42318;
  --rojo-hover:   #971e14;
  --rojo-suave:   #fdf1f0;
  --rojo-borde:   #edcbc8;
  --neutro-50:    #fafaf9;
  --neutro-100:   #f4f2f1;
  --neutro-200:   #e9e5e3;
  --neutro-400:   #a8998f;
  --neutro-700:   #4a3f3a;
  --neutro-900:   #1c1715;
  --panel:        #ffffff;
  --sombra-xs:    0 1px 2px rgba(28,23,21,.06);
  --sombra-sm:    0 2px 8px rgba(28,23,21,.08);
  --radio:        14px;
  --radio-sm:     9px;
}

/* ── Reset ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: 15px/1.65 "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--neutro-100);
  color: var(--neutro-900);
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ── Cabecera ────────────────────────────────────────────────────── */
header {
  background: var(--panel);
  border-bottom: 1px solid var(--neutro-200);
  height: 56px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 20;
}

.hd-marca {
  display: flex;
  align-items: center;
  gap: 10px;
}
.hd-ojo {
  width: 28px;
  height: 28px;
  background: var(--rojo);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.hd-ojo svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.hd-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--neutro-900);
  letter-spacing: 0.01em;
}

.sep { flex: 1; }

.btn-nueva {
  height: 34px;
  padding: 0 14px;
  background: transparent;
  border: 1px solid var(--neutro-200);
  border-radius: var(--radio-sm);
  color: var(--neutro-700);
  font: 13px/1 "Inter", system-ui, sans-serif;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: border-color .15s, background .15s;
  white-space: nowrap;
}
.btn-nueva svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.btn-nueva:hover { border-color: var(--neutro-400); background: var(--neutro-50); }
.btn-nueva:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }

/* ── Main ────────────────────────────────────────────────────────── */
main {
  flex: 1;
  overflow-y: auto;
  padding: 24px 16px 20px;
  scroll-behavior: smooth;
}

.chat {
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ── Pantalla de inicio ──────────────────────────────────────────── */
.inicio {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 14px;
  padding: 56px 20px 36px;
}
.inicio-icon {
  width: 56px;
  height: 56px;
  background: var(--rojo-suave);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.inicio-icon svg { width: 26px; height: 26px; fill: none; stroke: var(--rojo); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.inicio h2 {
  font-size: 20px;
  font-weight: 700;
  color: var(--neutro-900);
  line-height: 1.3;
}
.inicio-desc {
  font-size: 14.5px;
  color: var(--neutro-400);
  max-width: 440px;
  line-height: 1.6;
}
.inicio-aviso {
  font-size: 12px;
  color: var(--neutro-400);
  background: var(--neutro-100);
  border: 1px solid var(--neutro-200);
  border-radius: var(--radio-sm);
  padding: 8px 16px;
  max-width: 440px;
}

.sugerencias {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 580px;
  margin-top: 4px;
}
.sugerencia {
  background: var(--panel);
  border: 1px solid var(--neutro-200);
  border-radius: 20px;
  color: var(--neutro-700);
  font: 13px/1 "Inter", system-ui, sans-serif;
  padding: 8px 15px;
  cursor: pointer;
  text-align: left;
  transition: border-color .15s, background .15s, color .15s;
}
.sugerencia:hover { border-color: var(--rojo-borde); background: var(--rojo-suave); color: var(--rojo-hover); }
.sugerencia:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }

/* ── Burbujas ───────────────────────────────────────────────────── */
.m {
  max-width: min(74%, 640px);
  padding: 13px 17px;
  border-radius: var(--radio);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 14.5px;
  line-height: 1.65;
}

/* Usuario (derecha) */
.usuario {
  align-self: flex-end;
  background: var(--rojo);
  color: #fff;
  border-bottom-right-radius: 4px;
  box-shadow: var(--sombra-xs);
}

/* Asistente (izquierda) */
.asistente {
  align-self: flex-start;
  background: var(--panel);
  border: 1px solid var(--neutro-200);
  border-bottom-left-radius: 4px;
  box-shadow: var(--sombra-xs);
}

/* Sistema / aviso */
.sistema {
  align-self: center;
  max-width: 86%;
  background: var(--rojo-suave);
  border: 1px solid var(--rojo-borde);
  border-radius: var(--radio-sm);
  font-size: 13.5px;
  color: var(--rojo-hover);
}

/* ── Meta (ruta, citas, reformulación) ──────────────────────────── */
.meta {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 12px;
  color: var(--neutro-400);
  white-space: normal;
}
.meta-ruta {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
}
.meta-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--neutro-200);
  flex-shrink: 0;
}
.meta-consulta { font-style: italic; font-size: 12px; }

/* Alerta inyección */
.alerta-inj {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #fff8e6;
  border: 1px solid #f0d882;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 11.5px;
  color: #7a5900;
  font-weight: 500;
}

/* ── Citas ──────────────────────────────────────────────────────── */
details { margin-top: 10px; }
summary {
  cursor: pointer;
  color: var(--rojo);
  font-size: 12.5px;
  font-weight: 600;
  list-style: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  user-select: none;
}
summary::-webkit-details-marker { display: none; }
summary::before {
  content: "▸";
  font-size: 11px;
  transition: transform .15s;
  display: inline-block;
}
details[open] summary::before { transform: rotate(90deg); }

.cita {
  margin-top: 8px;
  padding: 10px 13px;
  border-left: 3px solid var(--rojo);
  background: var(--neutro-50);
  border-radius: 0 var(--radio-sm) var(--radio-sm) 0;
  font-size: 13px;
}
.cita-cabecera { font-weight: 600; color: var(--rojo-hover); margin-bottom: 2px; }
.cita-ref { font-size: 11px; color: var(--neutro-400); margin-bottom: 5px; }
.cita-cuerpo { color: var(--neutro-700); line-height: 1.55; }

/* ── Indicador de escritura ─────────────────────────────────────── */
.escribiendo {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--neutro-400);
  font-size: 13.5px;
  font-style: italic;
}
.dots { display: flex; gap: 3px; }
.dots span {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--neutro-400);
  animation: blink 1.3s infinite;
}
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }

/* ── Footer / barra de entrada ──────────────────────────────────── */
footer {
  background: var(--panel);
  border-top: 1px solid var(--neutro-200);
  padding: 12px 16px 14px;
  flex-shrink: 0;
}
.barra {
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
.barra textarea {
  flex: 1;
  min-height: 48px;
  max-height: 150px;
  resize: vertical;
  border: 1px solid var(--neutro-200);
  border-radius: var(--radio);
  background: var(--neutro-50);
  color: var(--neutro-900);
  font: 14.5px/1.55 "Inter", system-ui, sans-serif;
  padding: 11px 14px;
  outline: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.barra textarea::placeholder { color: var(--neutro-400); }
.barra textarea:focus {
  border-color: var(--rojo);
  background: var(--panel);
  box-shadow: 0 0 0 3px rgba(180,35,24,.12);
}
.barra textarea:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }

.btn-enviar {
  height: 48px;
  min-width: 48px;
  padding: 0 18px;
  border: none;
  border-radius: var(--radio);
  background: var(--rojo);
  color: #fff;
  font: 600 14px/1 "Inter", system-ui, sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  flex-shrink: 0;
  transition: background .15s;
  box-shadow: var(--sombra-sm);
}
.btn-enviar svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-enviar:hover { background: var(--rojo-hover); }
.btn-enviar:disabled { opacity: .5; cursor: wait; }
.btn-enviar:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }

/* ── Responsive ─────────────────────────────────────────────────── */
@media (max-width: 580px) {
  header { padding: 0 14px; }
  .m { max-width: 92%; }
  .barra { flex-direction: column; align-items: stretch; }
  .btn-enviar { width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────────── -->
<header>
  <div class="hd-marca">
    <div class="hd-ojo" aria-hidden="true">
      <!-- Icono de documento/consulta -->
      <svg viewBox="0 0 24 24"><path d="M9 12h6M9 16h4M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9 7h6"/></svg>
    </div>
    <span class="hd-label">Consultor de ahorro</span>
  </div>
  <div class="sep"></div>
  <button class="btn-nueva" id="nueva" type="button" aria-label="Nueva conversación">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    Nueva consulta
  </button>
</header>

<!-- ── Chat ──────────────────────────────────────────────────────── -->
<main id="scroll" role="log" aria-live="polite" aria-label="Conversación">
  <div class="chat" id="chat"></div>
</main>

<!-- ── Input ─────────────────────────────────────────────────────── -->
<footer>
  <div class="barra">
    <textarea
      id="txt"
      placeholder="Consulta sobre productos, requisitos o condiciones de ahorro…"
      maxlength="1000"
      aria-label="Escribe tu consulta"
      rows="2"
    ></textarea>
    <button class="btn-enviar" id="enviar" type="button" aria-label="Enviar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      Enviar
    </button>
  </div>
</footer>

<script>
/* ── Helpers ─────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mem = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} }
};

const paginasDe = c => {
  const ps = (c.paginas && c.paginas.length) ? c.paginas : [c.pagina];
  return ps.length === 1 ? `pág. ${ps[0]}` : `pág. ${ps.join(", ")}`;
};

function citas(lista) {
  if (!lista || !lista.length) return "";
  return `<details><summary>${lista.length} artículo(s) del manual</summary>${lista.map(c =>
    `<div class="cita"><b>Art. ${esc(c.id)} · ${esc(c.titulo)}</b> (${paginasDe(c)})<br>${esc(c.texto)}</div>`).join("")}</details>`;
}

/* ── Pintar mensaje ──────────────────────────────────────────────── */
function pintar(m) {
  if (m.id <= ultimo) return;
  ultimo = m.id;
  $("chat").querySelector(".inicio")?.remove();

  const div = document.createElement("div");
  const meta = m.meta || {};
  const rolCSS = (m.rol === "usuario" || m.rol === "asesor") ? "usuario"
               : m.rol === "asistente" ? "asistente" : "sistema";

  div.className = `m ${rolCSS}`;
  div.setAttribute("role", "article");

  let h = esc(m.texto);

  if (m.rol === "asistente") {
    const r = meta.router || {};
    if (meta.consulta && meta.consulta !== ultimaPregunta) h += `<div class="meta">Consulta de referencia: “${esc(meta.consulta)}”</div>`;
    h += citas(meta.citas);
    if (meta.estado) h += `<div class="meta">guardas: ${esc(meta.estado)}${meta.reservas && meta.reservas.length ? " · " + meta.reservas.length + " reserva(s)" : ""}</div>`;
    for (const rv of (meta.reservas || [])) h += `<div class="meta alerta">⚠ ${esc(rv)}</div>`;
    if (meta.inyeccion_sospechosa) h += `<div class="meta alerta">⚠ Este mensaje parece un intento de dar instrucciones al sistema. Quedó registrado.</div>`;
    h += `<div class="meta">ruta ${esc(meta.ruta)} · ${esc(r.proveedor)} ${r.confianza != null ? "· confianza " + Number(r.confianza).toFixed(2) : ""}${r.respaldo ? " · respaldo" : ""}</div>`;
  }

  if (m.rol === "usuario" || m.rol === "asesor") ultimaPregunta = m.texto;
  div.innerHTML = h;
  $("chat").appendChild(div);
  $("scroll").scrollTop = $("scroll").scrollHeight;
}

/* ── Pantalla inicial ────────────────────────────────────────────── */
function mostrarInicio() {
  $("chat").innerHTML = `
    <div class="inicio" role="complementary">
      <div class="inicio-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
      </div>
      <h2>¿En qué puedo ayudarte?</h2>
      <p class="inicio-desc">
        Consulta productos, condiciones y requisitos documentados.<br>
        Las respuestas se apoyan en las fuentes indexadas.
      </p>
      <p class="inicio-aviso" role="note">
        Prototipo informativo · Las respuestas provienen exclusivamente de los documentos cargados.
      </p>
      <div class="sugerencias" role="list" aria-label="Ejemplos de consulta">
        ${EJEMPLOS.map(e => `<button class="sugerencia" type="button" role="listitem">${esc(e)}</button>`).join("")}
      </div>
    </div>`;
  $("chat").querySelectorAll(".sugerencia").forEach(b => {
    b.onclick = () => { $("txt").value = b.textContent; $("txt").focus(); };
  });
}

/* ── Cargar historial ────────────────────────────────────────────── */
async function cargar() {
  if (!conv) return mostrarInicio();
  try {
    const r = await fetch(`/api/chat/${conv}?desde=${ultimo}`);
    if (r.status === 404) { conv = null; mem.set("ch-conv", null); return mostrarInicio(); }
    const d = await r.json();
    d.mensajes.forEach(pintar);
    if (!d.mensajes.length && !ultimo) mostrarInicio();
  } catch { mostrarInicio(); }
}

/* ── Enviar + streaming ──────────────────────────────────────────── */
async function enviar() {
  const texto = $("txt").value.trim();
  if (!texto) return;
  $("enviar").disabled = true;
  $("txt").value = "";
  $("chat").querySelector(".inicio")?.remove();

  // Burbuja del usuario (provisional)
  const bUser = document.createElement("div");
  bUser.className = "m usuario";
  bUser.setAttribute("role", "article");
  bUser.textContent = texto;
  $("chat").appendChild(bUser);
  $("scroll").scrollTop = $("scroll").scrollHeight;

  // Indicador de escritura
  const esc2 = document.createElement("div");
  esc2.className = "m asistente escribiendo";
  esc2.innerHTML = `Consultando los documentos… <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>`;
  $("chat").appendChild(esc2);
  $("scroll").scrollTop = $("scroll").scrollHeight;

  try {
    const r = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversacion_id: conv, mensaje: texto })
    });

    if (!r.ok) {
      const err = await r.json().catch(() => ({ detail: "Error desconocido" }));
      esc2.remove(); bUser.remove();
      $("txt").value = texto;
      const av = document.createElement("div");
      av.className = "m sistema";
      av.textContent = `Error ${r.status}: ${typeof err.detail === "string" ? err.detail : JSON.stringify(err.detail)}`;
      $("chat").appendChild(av);
      $("scroll").scrollTop = $("scroll").scrollHeight;
      return;
    }

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", streamEl = null;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const trozos = buf.split("\n\n");
      buf = trozos.pop() || "";

      for (const raw of trozos) {
        const linea = raw.trim();
        if (!linea.startsWith("data:")) continue;
        let p; try { p = JSON.parse(linea.slice(5)); } catch { continue; }

        if (p.type === "start") {
          conv = p.conversacion_id;
          mem.set("ch-conv", String(conv));
        } else if (p.type === "chunk") {
          if (!streamEl) {
            esc2.remove();
            streamEl = document.createElement("div");
            streamEl.className = "m asistente";
            streamEl.setAttribute("role", "article");
            $("chat").appendChild(streamEl);
          }
          const actual = (streamEl.dataset.text || "") + p.delta;
          streamEl.dataset.text = actual;
          streamEl.innerHTML = esc(actual);
          $("scroll").scrollTop = $("scroll").scrollHeight;
        } else if (p.type === "done") {
          if (streamEl) streamEl.remove();
          esc2.remove();
          if (p.mensajes?.length) { bUser.remove(); p.mensajes.forEach(pintar); }
          if (p.conversacion_id) { conv = p.conversacion_id; mem.set("ch-conv", String(conv)); }
          break;
        }
      }
    }
  } catch {
    esc2.remove(); bUser.remove();
    $("txt").value = texto;
    const av = document.createElement("div");
    av.className = "m sistema";
    av.textContent = "No se pudo conectar con el servicio. Verifica que el servidor esté en ejecución.";
    $("chat").appendChild(av);
    $("scroll").scrollTop = $("scroll").scrollHeight;
  } finally {
    $("enviar").disabled = false;
    $("txt").focus();
  }
}

/* ── Eventos ─────────────────────────────────────────────────────── */
$("enviar").onclick = enviar;
$("txt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
});
$("nueva").onclick = () => {
  conv = null; ultimo = 0; ultimaPregunta = "";
  mem.set("ch-conv", null);
  mostrarInicio();
  $("txt").focus();
};

cargar();
</script>
</body>
</html>
