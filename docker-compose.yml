# Lab 06: app (FastAPI) + Prometheus + Grafana.
# Usa los puertos 8000, 9090 y 3000: si tienes levantado el lab 04, primero ejecuta "docker compose down" en esa carpeta.
services:
  app:
    build: .
    env_file: .env
    environment:
      DB_PATH: /datos/chat.db
      INDICE_PATH: /datos/indice.npz
    volumes:
      - datos:/datos                 # la base y el índice sobreviven a "docker compose down" (no a "down -v")
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.5.5
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.4.11
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  datos:
